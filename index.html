    <!-- Paint the site's own background at once, and keep the plain-text snapshot (for search
         engines and link previews) out of sight while the app loads. If the app hasn't started
         after 4 seconds, the snapshot shows, so the page is never blank. -->
    <script>
      document.documentElement.classList.add("js");
      try {
        var a = JSON.parse(localStorage.getItem("lofs-a11y") || "{}");
        if (a.text) document.documentElement.classList.add("a11y-text");
        if (a.contrast) document.documentElement.classList.add("a11y-contrast");
        if (a.motion) document.documentElement.classList.add("a11y-still");
      } catch (e) {}
      setTimeout(function () { if (!window.__lofsMounted) document.documentElement.classList.remove("js"); }, 4000);
    </script>
    <style>

      @media (prefers-color-scheme: dark) { html, body { background: #101716; color: #e9efec; } }
